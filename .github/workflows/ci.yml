name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the outdated run.
# On main every run is kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Guard - no personal data in tracked files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(profile\.json|[^/]*\.profile\.json|studienverlauf-[^/]*\.json)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Personal data files are tracked by git:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest

      - name: Build
        run: python build.py

      - name: E2E tests
        run: python -m pytest tests/e2e

      - name: Build Docker image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t studienplaner:ci .

      - name: Start container
        run: docker run -d --name studienplaner --health-interval=2s -p 8080:8080 studienplaner:ci

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' studienplaner)" = healthy ] && exit 0
            sleep 2
          done
          docker logs studienplaner
          exit 1

      - name: Container runs as non-root user
        run: test "$(docker exec studienplaner id -u)" != "0"

      - name: Image contains exactly the neutral build
        run: |
          docker cp studienplaner:/usr/share/nginx/html/index.html /tmp/image-index.html
          cmp dist/index.html /tmp/image-index.html

      - name: E2E tests against the container
        run: python -m pytest tests/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080

      - name: Container does not log visitors
        run: |
          if docker logs studienplaner 2>&1 | grep -E '(GET|POST|HEAD) /'; then
            echo "::error::The container logs requests"
            exit 1
          fi

      - name: Validate the compose file
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Start the container the way compose does (hardened)
        run: |
          docker tag studienplaner:ci ghcr.io/eljakj/htw-studienplaner:ci
          IMAGE_TAG=ci docker compose -f deploy/compose.yaml up -d --pull never --wait --wait-timeout 60

      - name: Check the compose deployment
        run: |
          curl -fsS http://127.0.0.1:8085/healthz
          python -m pytest tests/e2e/test_container.py
        env:
          E2E_BASE_URL: http://127.0.0.1:8085

      - name: Stop the compose deployment
        if: always()
        run: docker compose -f deploy/compose.yaml down

      - name: Container logs
        if: failure()
        run: |
          docker logs studienplaner || true
          docker compose -f deploy/compose.yaml logs || true

      - name: Upload built page
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.html
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
