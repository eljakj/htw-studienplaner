# Server block for the static page. In the image it replaces
# /etc/nginx/conf.d/default.conf of nginx-unprivileged (user "nginx", port 8080).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Privacy: no access log, and only serious errors in the error log. A missing
    # file ("404") is logged at level "error" together with the client address,
    # so the level is set to "crit". Visitor addresses are never stored.
    access_log off;
    error_log stderr crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. The script policy (hash of the inline script) is a <meta>
    # tag inside the page, generated by build.py; this header adds what a <meta>
    # tag cannot do. Both policies apply. No add_header inside the locations
    # below: that would drop these headers there.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The whole app is this one file: browsers must revalidate it (Cache-Control:
    # no-cache), so an update is live on the next visit.
    location = /index.html {
        expires -1;
    }
}
